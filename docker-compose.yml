version: '3.8'

services:
  vision:
    build: ./vision
    ports:
      - "5000:5000"
    volumes:
      - ./vision:/app
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - vision
    restart: unless-stopped
